apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "mcp-server-kubernetes.name" . }}-pod-reader-binding
  labels:
    {{- include "mcp-server-kubernetes.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "mcp-server-kubernetes.name" . }}-pod-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "mcp-server-kubernetes.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
